name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npm test -w demo
      - run: npm run build -w @brianhung/emoji-picker-core
      - run: npm run build -w @brianhung/emoji-picker-react
      - run: npm run size
      - run: npm run build -w @brianhung/emoji-picker-data && npm test -w @brianhung/emoji-picker-data
      - run: npx publint packages/core && npx publint packages/react && npx publint packages/data
      - run: npx @arethetypeswrong/cli --pack packages/core --profile esm-only && npx @arethetypeswrong/cli --pack packages/react --profile esm-only --exclude-entrypoints ./tokens.css ./theme.css ./shadcn.css

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build -w @brianhung/emoji-picker-core && npm run build -w @brianhung/emoji-picker-react
      - run: npm pack -w @brianhung/emoji-picker-core -w @brianhung/emoji-picker-react --pack-destination "$RUNNER_TEMP"
      # A fresh Vite + React app on the packed tarballs; importing only the picker must leave Floating UI out
      - working-directory: ${{ runner.temp }}
        run: |
          cp -R "$GITHUB_WORKSPACE/.github/smoke" app && cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../brianhung-emoji-picker-core-*.tgz ../brianhung-emoji-picker-react-*.tgz react react-dom vite @floating-ui/react
          npx vite build --sourcemap
          node check.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      E2E_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - uses: actions/cache@v4
        with:
          path: apps/demo/e2e/.cache
          key: e2e-remote-${{ github.run_id }}
          restore-keys: e2e-remote-
      # Every project but visual: its baselines are local (gitignored)
      - working-directory: apps/demo
        run: npx playwright test --shard ${{ matrix.shard }} --project keyboard --project keyboard-mobile --project editors --project layout --project ime --project perf
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ strategy.job-index }}
          path: |
            apps/demo/e2e/.results
            apps/demo/e2e/.report
          if-no-files-found: ignore

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:a11y
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: a11y-results, path: apps/demo/e2e/a11y/.results, if-no-files-found: ignore }
