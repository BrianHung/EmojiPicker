# Accessibility checks for the demo site (apps/demo):
#   a11y       axe-core on every page and picker surface (ubuntu)       npm run test:a11y
#   voiceover  Guidepup + VoiceOver (macOS)                             npm run test:sr:voiceover
#   nvda       Guidepup + NVDA (Windows)                                npm run test:sr:nvda
# Each Playwright run starts the demo's dev server itself (apps/demo/playwright.config.ts → webServer).
# Guidepup's environment setup follows https://github.com/guidepup/setup: `setup --ci` configures
# the OS once per runner, `install` fetches the screen reader assets for this Guidepup version.
# (guidepup/setup-action is archived; the CLI is the documented path.)
# JAWS isn't automated: it needs a licence and Guidepup has no JAWS driver. Test it by hand
# (see apps/demo/README.md, "Accessibility").
name: Accessibility

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y -w demo
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: a11y-results, path: apps/demo/e2e/a11y/.results, if-no-files-found: ignore }

  voiceover:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
      - name: Set up VoiceOver for automation
        run: npx @guidepup/setup setup --ci
      - name: Install Guidepup's VoiceOver assets
        working-directory: apps/demo
        run: npx @guidepup/setup install voiceover
      - run: npm run test:sr:voiceover -w demo
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: voiceover-results, path: apps/demo/e2e/sr/.results, if-no-files-found: ignore }

  nvda:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
      - name: Set up the runner for NVDA
        run: npx @guidepup/setup setup --ci
      - name: Install Guidepup's NVDA
        working-directory: apps/demo
        run: npx @guidepup/setup install nvda
      - run: npm run test:sr:nvda -w demo
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: nvda-results, path: apps/demo/e2e/sr/.results, if-no-files-found: ignore }
