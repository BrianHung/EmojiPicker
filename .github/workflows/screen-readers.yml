name: Screen readers

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

concurrency:
  group: screen-readers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  voiceover:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
      - name: Set up VoiceOver for automation
        run: npx @guidepup/setup setup --ci
      - name: Install Guidepup's VoiceOver assets
        working-directory: apps/demo
        run: npx @guidepup/setup install voiceover
      - name: VoiceOver scenarios
        working-directory: apps/demo
        shell: bash
        run: |
          for attempt in 1 2; do
            npm run test:sr:voiceover 2>&1 | tee "$RUNNER_TEMP/voiceover.log" && exit 0
            grep -qE "VoiceOver cannot be started|osascript.*ETIMEDOUT" "$RUNNER_TEMP/voiceover.log" || exit 1
            echo "::warning::VoiceOver couldn't start (attempt $attempt)"
          done
          exit 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: voiceover-results, path: apps/demo/e2e/sr/.results, if-no-files-found: ignore, include-hidden-files: true }

  nvda:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install chromium
      - name: Set up the runner for NVDA
        run: npx @guidepup/setup setup --ci
      - name: Install Guidepup's NVDA
        working-directory: apps/demo
        run: npx @guidepup/setup install nvda
      - name: NVDA scenarios
        run: npm run test:sr:nvda -w demo
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: nvda-results, path: apps/demo/e2e/sr/.results, if-no-files-found: ignore, include-hidden-files: true }
