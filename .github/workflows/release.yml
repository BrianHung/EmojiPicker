name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "version: open the Version packages PR. publish: publish main to npm."
        type: choice
        options: [version, publish]
        default: version

run-name: Release (${{ inputs.mode }})

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  version:
    if: inputs.mode == 'version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: changesets/action/version@v2
        with:
          script: npm run version-packages
          pr-title: Version packages
          commit-message: Version packages

  publish:
    if: inputs.mode == 'publish' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: CI passed on this commit
        run: test "$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -c "$GITHUB_SHA" -s success -L 1 --json databaseId -q length)" = 1
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: "https://registry.npmjs.org" }
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@11.21.2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: packages/twemoji-font/.cache/twemoji-*
          key: twemoji-svg-${{ hashFiles('packages/twemoji-font/package.json') }}
      - uses: actions/cache/restore@v4
        with:
          path: packages/twemoji-font/.cache/venv
          key: twemoji-venv-${{ runner.os }}-py3.12-${{ hashFiles('packages/twemoji-font/requirements.txt') }}
      - uses: actions/cache/restore@v4
        with:
          path: packages/twemoji-font/.cache/build
          key: twemoji-build-${{ runner.os }}-${{ hashFiles('packages/twemoji-font/package.json', 'packages/twemoji-font/requirements.txt', 'packages/twemoji-font/scripts/build.ts') }}
          restore-keys: twemoji-build-${{ runner.os }}-
      - id: playwright
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: node .github/release-steps.mjs check font smoke onboarding
      # changeset publish skips versions already on npm; pre mode publishes to the alpha dist-tag
      - uses: changesets/action/publish@v2
