        - 'gridcell "keycap: 2"': 2️⃣
        - 'gridcell "keycap: 3"': 3️⃣
        - gridcell "megaphone": 📣
        - gridcell "white circle": ⚪
        - gridcell "blue circle": 🔵
        - gridcell "red circle": 🔴
