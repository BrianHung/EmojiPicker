    - rowgroup "Getting Work Done":
      - 'row "check mark button eyes raising hands folded hands plus clapping hands light bulb bullseye waving hand thumbs up party popper keycap: 1 keycap: 2 keycap: 3 megaphone white circle blue circle red circle"':
