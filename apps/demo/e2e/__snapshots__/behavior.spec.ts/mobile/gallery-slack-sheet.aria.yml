- complementary "Emoji picker":
  - tablist "Category navigation":
    - tab "Smileys & People"
    - tab "Animals & Nature"
    - tab "Food & Drink"
    - tab "Travel & Places"
    - tab "Activities"
    - tab "Objects"
    - tab "Symbols"
    - tab "Flags"
  - combobox "Type to search for an emoji" [expanded]
