- dialog "Select emoji":
  - heading "Select emoji" [level=2]
  - complementary "Emoji picker":
    - tablist:
      - tab "GIFs" [disabled]
      - tab "Stickers" [disabled]
      - tab "Emoji" [selected]
    - combobox "Type to search for an emoji" [expanded]
    - button "Default skin tone":
      - img "clapping hands"
    - tablist "Category navigation":
      - tab "Frequently Used" [selected]
      - tab "People"
      - tab "Nature"
      - tab "Food"
      - tab "Activities"
      - tab "Travel"
      - tab "Objects"
      - tab "Symbols"
      - tab "Flags"
